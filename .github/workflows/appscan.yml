name: HCL AppScan on Cloud (ASoC) SAST Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  AppScan-SAST:
    name: Run AppScan SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Download & Install HCL AppScan CLI (SAClientUtil)
        run: |
          wget https://cloud.appscan.com/api/SCX/StaticAnalyzer/SAClientUtil?os=linux -O SAClientUtil.zip
          unzip -q SAClientUtil.zip
          
          # Temukan folder hasil unzip SAClientUtil dan tambahkan ke PATH
          SAC_DIR=$(find . -maxdepth 1 -type d -name "SAClientUtil*" | head -n 1)
          echo "$PWD/$SAC_DIR/bin" >> $GITHUB_PATH

      - name: 3. Verify Secrets & Login to ASoC
        run: |
          if [ -z "${{ secrets.ASOC_KEY_ID }}" ] || [ -z "${{ secrets.ASOC_KEY_SECRET }}" ]; then
            echo "ERROR: ASOC_KEY_ID atau ASOC_KEY_SECRET belum terpasang di GitHub Secrets!"
            exit 1
          fi
          appscan.sh api_login -u ${{ secrets.ASOC_KEY_ID }} -P ${{ secrets.ASOC_KEY_SECRET }} -persist

      - name: 4. Generate Scan Package & Run Scan
        run: |
          # Prepare paket analisis
          appscan.sh prepare -n Java_WebGoat_Scan -d .

          # Invoke scan menggunakan Nama Aplikasi atau Application ID dari ASoC
          appscan.sh invoke -n Java_WebGoat_Scan -a "Demo-Java-SpringSecurity" --fail-build
